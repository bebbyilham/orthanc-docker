services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: always
    ports:
      - "8042:8042" # Web UI
      - "4242:4242" # DICOM listener
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
    networks:
      - orthanc-net

networks:
  orthanc-net:
    driver: bridge

volumes:
  orthanc-data:
