services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: always
    ports:
      - "8042:8042" # Web UI Orthanc
      - "4242:4242" # DICOM port
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
    networks:
      - dicom-network

networks:
  dicom-network:
    external: true
    name: docker-dicom-satusehat_dicom-network # <— network router kamu

volumes:
  orthanc-data:
