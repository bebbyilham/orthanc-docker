version: "3.8"

services:
  orthanc:
    image: orthanc/orthanc-plugins:latest
    container_name: orthanc
    restart: always
    ports:
      - "8042:8042"   # Web UI & REST API
      - "4242:4242"   # DICOM Port
    environment:
      # 🧑‍💻 Akses Web Admin
      ORTHANC__REGISTERED_USERS: |
        {
          "admin": "admin123"
        }

      # ⚙️ Konfigurasi Dasar
      ORTHANC__NAME: "OrthancDocker"
      ORTHANC__DICOM_AET: "ORTHANC"
      ORTHANC__DICOM_PORT: 4242
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"

      # 🔄 Remote AE (DICOM Router)
      ORTHANC__DICOM_MODALITIES: |
        {
          "DCMROUTER": ["172.18.1.2", 11112, "DCMROUTER"]
        }

      # 🌐 Aktifkan DICOMweb API
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"

      # 📦 Direktori Penyimpanan DICOM
      ORTHANC__STORAGE_DIRECTORY: "/var/lib/orthanc/db"

    volumes:
      - ./orthanc-db:/var/lib/orthanc/db
