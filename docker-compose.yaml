version: "3.8"

services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: always
    ports:
      - "8042:8042" # Web UI Orthanc
      - "4242:4242" # DICOM listener port
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
    networks:
      - dicom-net

  dicom-router:
    image: registry.dto.kemkes.go.id/pub/dicom-router:latest
    container_name: dicom-router
    restart: always
    ports:
      - "8080:8080" # Web UI router (opsional)
      - "11112:11112" # DICOM listener
    environment:
      - TZ=Asia/Jakarta
    networks:
      - dicom-net

networks:
  dicom-net:
    driver: bridge

volumes:
  orthanc-data:
